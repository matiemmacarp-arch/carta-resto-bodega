<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Resto de la Bodega · Carta Digital</title>
  <meta name="description" content="Carta digital de Resto de la Bodega - Cutral Co">
  <meta property="og:title" content="Resto de la Bodega · Carta Digital">
  <meta property="og:description" content="Menú digital actualizado">
  <meta property="og:type" content="website">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Loader -->
  <div id="loader">
    <div class="loader-content">
      <div class="loader-logo">🍷</div>
      <div class="loader-text">Resto de la Bodega</div>
      <div class="progress-bar"><div class="progress"></div></div>
    </div>
  </div>

  <!-- Language switcher -->
  <div class="lang-switcher" id="lang-switcher">
    <button class="lang-btn active" data-lang="es" title="Español">ES</button>
    <button class="lang-btn" data-lang="en" title="English">EN</button>
    <button class="lang-btn" data-lang="pt" title="Português">PT</button>
    <button class="lang-btn" data-lang="fr" title="Français">FR</button>
  </div>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="navbar-brand">
      <span class="brand-icon">🍷</span>
      <span class="brand-text" data-i18n="menu">MENÚ</span>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>
    <div class="navbar-links" id="navbar-links">
      <!-- Se llena dinámicamente -->
    </div>
  </nav>

  <!-- Hero -->
  <header class="hero">
    <div class="hero-content">
      <div class="hero-logo">🍷</div>
      <h1>Resto de la Bodega</h1>
      <p class="hero-subtitle">Cutral Co · Neuquén</p>
      <div class="hero-links">
        <a href="https://maps.app.goo.gl/AVd42CywWp3gdc6X7" target="_blank" rel="noopener" class="hero-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
          <span data-i18n="howToGet">Cómo llegar</span>
        </a>
        <a href="https://www.instagram.com/restodelabodega" target="_blank" rel="noopener" class="hero-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
          <span data-i18n="instagram">Instagram</span>
        </a>
      </div>
    </div>
    <div class="scroll-hint" onclick="document.getElementById('menu').scrollIntoView({behavior:'smooth'})">
      <span data-i18n="viewMenu">Ver carta</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>
  </header>

  <!-- Menu container -->
  <main id="menu" class="menu-container">
    <!-- Se renderiza dinámicamente -->
  </main>

  <!-- Floating cart button -->
  <button id="cart-button" class="floating-cart" aria-label="Ver pedido">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="9" cy="21" r="1"></circle>
      <circle cx="20" cy="21" r="1"></circle>
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
    </svg>
    <span class="cart-label" data-i18n="order">Pedido</span>
    <span id="cart-count" class="cart-count hidden">0</span>
  </button>

  <!-- Scroll buttons -->
  <button id="scroll-top" class="scroll-btn top" aria-label="Subir">↑</button>
  <button id="scroll-bottom" class="scroll-btn bottom" aria-label="Bajar">↓</button>

  <!-- Cart modal -->
  <div id="cart-modal" class="modal hidden">
    <div class="modal-content cart-modal-content">
      <div class="modal-header">
        <h2 data-i18n="yourOrder">Tu pedido</h2>
        <button class="modal-close" id="close-cart">&times;</button>
      </div>
      <div id="cart-items" class="cart-items"></div>
      <div class="cart-footer">
        <div class="cart-total">
          <span data-i18n="total">Total</span>
          <strong id="cart-total">$0</strong>
        </div>
        <div class="cart-actions">
          <button id="clear-cart" class="btn btn-outline" data-i18n="empty">Vaciar</button>
          <button id="confirm-order" class="btn btn-primary" data-i18n="sendOrder">Enviar pedido</button>
        </div>
        <p class="cart-note" data-i18n="cartNote">El pedido se enviará por WhatsApp</p>
      </div>
    </div>
  </div>

  <!-- Admin login (simple) -->
  <div id="admin-bar" class="admin-bar hidden">
    <span>Modo administrador</span>
    <button id="logout-btn" class="btn-sm">Salir</button>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p class="footer-phrase" data-i18n="footerPhrase">Carta digital propia · Sin intermediarios</p>
    <p class="footer-copy">© 2026 Resto de la Bodega · Cutral Co</p>
    <p class="footer-admin"><a href="admin.html" style="color:var(--text-muted);font-size:0.7rem;opacity:0.5;">Admin</a></p>
  </footer>

  <script src="menu-data.js"></script>
  <script src="i18n.js"></script>
  <script src="script.js"></script>
</body>
</html>
